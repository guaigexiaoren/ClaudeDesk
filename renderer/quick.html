<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
    />
    <title>快速提问</title>
    <style>
      :root {
        --q-bg: #101216;
        --q-panel: #16181d;
        --q-input: #1c1f27;
        --q-border: #2c313a;
        --q-text: #e6e6e6;
        --q-muted: #6b7280;
        --q-accent: #d97757;
        --q-accent-border: rgba(217, 119, 87, 0.65);
      }
      :root[data-theme='pure'] {
        --q-bg: #0b0b0b;
        --q-panel: #111111;
        --q-input: #171717;
        --q-border: #2a2a2a;
        --q-text: #f2f2f2;
        --q-muted: #7a7a7a;
        --q-accent-border: rgba(217, 119, 87, 0.65);
      }
      :root[data-theme='light'] {
        --q-bg: #ece7df;
        --q-panel: #fbf9f5;
        --q-input: #f6f3ee;
        --q-border: #d6cec3;
        --q-text: #2b2521;
        --q-muted: #786d63;
        --q-accent-border: rgba(217, 119, 87, 0.65);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--q-bg);
        color: var(--q-text);
        font-family: 'Segoe UI', 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif;
        -webkit-app-region: drag;
      }
      .quick {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        padding: 20px 22px;
        border: 1px solid var(--q-border);
        border-radius: 12px;
        background: var(--q-panel);
      }
      .quick-mark {
        position: absolute;
        left: 22px;
        top: 22px;
        color: var(--q-accent);
        font-size: 18px;
      }
      #quick-input {
        -webkit-app-region: no-drag;
        width: 100%;
        padding: 11px 14px 11px 40px;
        border: 1px solid var(--q-border);
        border-radius: 10px;
        outline: none;
        background: var(--q-input);
        color: var(--q-text);
        font-family: inherit;
        font-size: 15px;
      }
      #quick-input:focus {
        border-color: var(--q-accent-border);
      }
      #quick-input::placeholder {
        color: var(--q-muted);
      }
      .quick-hint {
        padding-left: 2px;
        color: var(--q-muted);
        font-size: 11.5px;
      }
    </style>
  </head>
  <body>
    <div class="quick">
      <span class="quick-mark">✳</span>
      <input
        id="quick-input"
        type="text"
        placeholder="快速问 Claude…"
        autocomplete="off"
        spellcheck="false"
      />
      <div class="quick-hint">Enter 发送并切到主窗口 · Esc 关闭</div>
    </div>
    <script src="quick.js"></script>
  </body>
</html>
